<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dynamic iOS Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wallpaper-container">
        <canvas id="gl-canvas"></canvas>

        <div id="info-overlay">
            <div id="current-date"></div>
            <div id="current-time"></div>
            <div class="weather-row" title="Нажмите для переключения погоды">
                <span id="current-temp">--°</span>
                <span id="weather-separator">•</span>
                <span id="current-weather-description">Синхронизация...</span>
            </div>
            <div id="current-city"></div>
        </div>
    </div>
	<script src="three.min.js" defer></script>
    <script src="weather.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
